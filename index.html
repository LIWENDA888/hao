<!DOCTYPE html>
<html lang="zh-CN" class="scroll-pt-[110px] scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自在导航 - 设计师的灵感百宝库</title>
    <link rel="icon" href="https://pic3.fukit.cn/autoupload/NWINCyTOTWqNUcPQazQq69iO_OyvX7mIgxFBfDMDErs/20251123/AR9P/ico.ico" type="zizaoicon">
    
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://unpkg.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Helvetica Neue', 'Arial', 'sans-serif'] },
                    boxShadow: { 'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)' },
                    animation: { 'fade-in': 'fadeIn 0.5s ease-out forwards', 'fade-in-up': 'fadeInUp 0.4s ease-out forwards', 'blob': 'blob 10s infinite' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        fadeInUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        blob: { '0%': { transform: 'translate(0px, 0px) scale(1)' }, '33%': { transform: 'translate(30px, -50px) scale(1.1)' }, '66%': { transform: 'translate(-20px, 20px) scale(0.9)' }, '100%': { transform: 'translate(0px, 0px) scale(1)' } }
                    }
                },
            },
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="min-h-screen bg-[#F5F5F7] text-gray-900 transition-colors duration-500 dark:bg-[#000000] dark:text-gray-100 font-sans selection:bg-[#FF8C19]/30 overflow-x-hidden">

    <div id="ambient-bg" class="fixed inset-0 z-0 pointer-events-none overflow-hidden transition-opacity duration-700">
        <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-blue-400/10 blur-[80px] dark:bg-blue-900/10 mix-blend-multiply dark:mix-blend-screen animate-blob"></div>
        <div class="absolute top-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-orange-400/10 blur-[80px] dark:bg-orange-900/10 mix-blend-multiply dark:mix-blend-screen animate-blob animation-delay-2000"></div>
    </div>

    <header class="fixed top-0 left-0 z-50 w-full py-3 md:py-4 pointer-events-none">
        <div id="header-bg" class="absolute inset-0 bg-[#F2F2F7]/80 dark:bg-black/80 transition-colors duration-500"></div>
        
        <div class="relative z-10 mx-auto flex w-full max-w-[1920px] px-4 md:px-8 items-center justify-between">
            <div class="relative z-50 flex items-center gap-4 md:gap-6 overflow-x-auto no-scrollbar mask-gradient-right pb-1 pointer-events-auto max-w-[calc(100%-140px)] md:max-w-[calc(100%-240px)]" id="header-links"></div>
            
            <div class="relative z-50 flex items-center gap-2 md:gap-4 pl-4 shrink-0 pointer-events-auto">
                
                <!-- 切换 APP 按钮 (九宫格版) -->
                <div class="relative group h-full flex items-center" id="app-switcher-container">
                    <button class="flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-medium text-gray-500 hover:text-[#FF8C19] hover:bg-black/5 transition-all dark:text-gray-400 dark:hover:text-[#FF8C19] dark:hover:bg-white/10 outline-none">
                        <i data-lucide="layout-grid" class="w-4 h-4"></i>
                        <span id="current-app-name">设计导航</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 transition-transform duration-300 group-hover:rotate-180"></i>
                    </button>

                    <!-- 下拉菜单 -->
                    <div class="absolute right-0 top-[80%] pt-4 w-[340px] opacity-0 translate-y-2 pointer-events-none group-hover:opacity-100 group-hover:translate-y-0 group-hover:pointer-events-auto transition-all duration-300 z-[60]">
                        <div class="p-2 rounded-2xl bg-white/90 backdrop-blur-xl border border-gray-200 shadow-2xl dark:bg-gray-900/95 dark:border-gray-800">
                            <div id="app-grid" class="max-h-[320px] overflow-y-auto custom-scrollbar"></div>
                        </div>
                    </div>
                </div>
                
                <div class="h-5 w-px bg-gray-300 dark:bg-gray-700 hidden sm:block"></div>
                
                <button id="theme-toggle" class="flex h-8 w-8 md:h-10 md:w-10 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-600 shadow-sm transition-all hover:text-[#FF8C19] hover:border-[#FF8C19] dark:bg-gray-800 dark:border-gray-700 dark:text-gray-300">
                    <i data-lucide="moon" class="h-4 w-4 md:h-5 md:w-5 block dark:hidden"></i>
                    <i data-lucide="sun" class="h-4 w-4 md:h-5 md:w-5 hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>

    <button id="mobile-menu-btn" class="fixed bottom-6 right-6 z-[60] rounded-full bg-[#FF8C19] p-3.5 md:p-4 text-white shadow-lg lg:hidden hover:bg-[#e67e17] transition-all"><i data-lucide="menu" class="h-6 w-6"></i></button>
    <div id="mobile-sidebar-overlay" class="fixed inset-0 z-[60] bg-black/20 backdrop-blur-sm hidden lg:hidden opacity-0 transition-opacity"></div>
    <aside id="mobile-sidebar" class="fixed left-0 top-0 z-[70] h-full w-[280px] transform translate-x-[-100%] overflow-y-auto bg-white border-r border-gray-200 px-6 py-8 transition-transform lg:hidden dark:bg-gray-900 dark:border-gray-800 shadow-2xl">
        <div class="mb-8 px-2 flex flex-col items-center">
             <img src="https://pic3.fukit.cn/autoupload/NWINCyTOTWqNUcPQazQq69iO_OyvX7mIgxFBfDMDErs/20251123/D8a9/219X79/haologo.png/webp" alt="Logo" class="h-10 w-auto object-contain mb-2">
             <div class="mt-2 text-xs text-gray-500 font-medium tracking-wide uppercase opacity-70">
                 当前库: <span id="mobile-app-name" class="font-bold text-[#FF8C19]">设计</span>
             </div>
        </div>
        <nav id="mobile-nav-links" class="space-y-2 pb-20"></nav>
    </aside>

    <main class="relative z-10 mx-auto w-full max-w-full lg:max-w-[95%] 2xl:max-w-[1920px] px-3 pt-[72px] md:pt-[92px] pb-8 md:px-8">
        <div class="grid grid-cols-1 lg:grid-cols-[256px_1fr] gap-6 md:gap-8 items-start">
            
            <div class="hidden lg:block sticky top-[92px] z-40 h-[calc(100vh-92px-32px)]">
                <aside class="w-full h-full flex flex-col panel-container p-1 rounded-3xl transition-all duration-500">
                    <div class="pt-6 pb-4 flex flex-col items-center shrink-0 relative">
                        <img id="desktop-logo" src="https://pic3.fukit.cn/autoupload/NWINCyTOTWqNUcPQazQq69iO_OyvX7mIgxFBfDMDErs/20251123/D8a9/219X79/haologo.png/webp" alt="Logo" class="w-[85%] h-auto object-contain cursor-pointer hover:scale-105 transition-transform" />
                        <div class="mt-4 flex items-center justify-center gap-2 text-[13px] font-medium text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-white/5 px-3 py-1 rounded-full border border-gray-200 dark:border-white/5">
                            <span class="relative flex h-2 w-2">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#FF8C19] opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2 w-2 bg-[#FF8C19]"></span>
                            </span>
                            <span>已收录 <span id="site-count" class="font-bold text-[#FF8C19] tabular-nums">0</span> 个资源</span>
                        </div>
                    </div>
                    <div class="mx-6 h-px bg-gray-200 dark:bg-white/10 mb-2"></div>
                    <nav id="desktop-nav-links" class="space-y-1 flex-1 overflow-y-auto no-scrollbar px-3 pb-3"></nav>
                </aside>
            </div>

            <div class="min-w-0 flex flex-col gap-5 md:gap-8">
               <div class="panel-container p-5 md:p-8 flex flex-col justify-center gap-4 md:gap-6 relative overflow-hidden rounded-2xl md:rounded-3xl transition-all duration-500">
                    <div class="flex flex-col transition-all duration-500 w-full relative z-10">
                        <!-- 搜索切换按钮区 -->
                        <div id="engine-switcher" class="flex gap-4 md:gap-6 mb-3 md:mb-4 pl-1 md:pl-2 overflow-x-auto no-scrollbar mask-gradient-right relative"></div>
                        
                        <form id="search-form" class="relative group flex items-center overflow-hidden rounded-xl md:rounded-2xl border border-gray-200 bg-gray-50 transition-all duration-300 hover:bg-white hover:border-gray-300 hover:shadow-md dark:border-gray-700 dark:bg-gray-800">
                            <div class="pl-3 md:pl-5 text-gray-400 group-focus-within:text-[#FF8C19] transition-colors"><i data-lucide="search" class="h-5 w-5 md:h-6 md:w-6"></i></div>
                            <input type="text" id="search-input" class="h-12 md:h-[68px] w-full bg-transparent px-3 md:px-4 text-base md:text-xl text-gray-800 placeholder-gray-400 outline-none dark:text-gray-100 font-medium tracking-wide" placeholder="搜索...">
                            <button type="submit" class="mr-1 md:mr-2 flex h-10 w-10 md:h-[52px] md:w-[52px] shrink-0 items-center justify-center rounded-lg md:rounded-xl bg-[#FF8C19] text-white hover:bg-[#ff9d33] hover:scale-105 active:scale-95 shadow-[0_4px_12px_rgba(255,140,25,0.4)]">
                                <i data-lucide="arrow-right" class="h-5 w-5 md:h-6 md:w-6"></i>
                            </button>
                        </form>
                    </div>
                    <!-- 快捷链接区 (已修复：支持横向滑动，移除换行) -->
                    <div id="quick-links" class="flex gap-2 md:gap-3 pl-1 md:pl-2 relative z-10 overflow-x-auto no-scrollbar mask-gradient-right pb-1"></div>
               </div>

               <div id="content-area" class="flex flex-col gap-5 md:gap-8"></div>

               <footer id="main-footer" class="mt-8 flex flex-col items-center justify-start pt-12 pb-[33vh] text-gray-400 dark:text-gray-600">
                <div class="flex items-center gap-2 mb-4 opacity-60">
                     <i data-lucide="coffee" class="w-5 h-5"></i>
                     <span class="text-sm font-medium tracking-widest">页面已经到底啦~</span>
                </div>
                <div class="w-12 h-px bg-gray-300 dark:bg-gray-800 mb-4"></div>
                <p class="text-xs opacity-50">© 2026 自在导航</p>
            </footer>
            </div>
        </div>
    </main>

    <script src="js/global-config.js"></script>
    <script src="js/design-data.js"></script>
    <script src="js/font-data.js"></script>
    <script src="js/prompt-data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
